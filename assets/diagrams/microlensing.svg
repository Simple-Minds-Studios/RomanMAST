<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">How gravitational microlensing changes the light we see</title><desc id="desc">A background star at left sends light past a foreground lens in the middle to an observer on the right. Two illustrative bent paths show gravity redirecting light. Geometry is schematic and not to scale.</desc><rect width="900" height="320" rx="18" fill="#0e1930"/><g font-family="system-ui,sans-serif" fill="#eef4ff"><text x="35" y="40" font-size="23" font-weight="600">Light bends. A background star can appear brighter.</text><path d="M125 155H770" stroke="#52627b" stroke-dasharray="7 8"/><path d="M125 155Q300 65 445 105L770 155M125 155Q300 245 445 205L770 155" fill="none" stroke="#85e9ff" stroke-width="4"/><circle cx="125" cy="155" r="19" fill="#ffd37c"/><path d="M125 120v-12m0 94v-12m-35-35H78m94 0h-12" stroke="#ffd37c" stroke-width="3"/><circle cx="445" cy="155" r="23" fill="#a58aff"/><circle cx="445" cy="155" r="42" fill="none" stroke="#a58aff" stroke-width="2" opacity=".5"/><circle cx="770" cy="155" r="17" fill="#8ee0bd"/><text x="125" y="248" text-anchor="middle" font-size="21">Background star</text><text x="445" y="248" text-anchor="middle" font-size="21">Foreground lens</text><text x="770" y="248" text-anchor="middle" font-size="21">Observer</text><text x="35" y="291" font-size="17" fill="#bdcbe3">Schematic, not to scale. Paths and positions illustrate the geometry, not a fitted event.</text></g></svg>
