<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">Published 1093 observing date ranges</title><desc id="desc">Six instrument series are shown on a shared reduced HJD axis, zoomed to 7440 through 7682. The OGLE and MOA baselines extend earlier than the displayed window. Bars indicate first-to-last dates, not continuous sampling.</desc><rect width="900" height="440" rx="18" fill="#0e1930"/><g font-family="system-ui,sans-serif" fill="#eef4ff"><text x="30" y="40" font-size="24" font-weight="600">One event. Different observing windows.</text><rect x="486.58" y="62" width="101.84" height="270" fill="#ffd37c" opacity=".08"/><text x="30" y="96" font-size="20">OGLE</text><path d="M160.00 90H773.33" stroke="#85e9ff" stroke-width="9" stroke-linecap="round"/><path d="M171 82l-12 8 12 8" fill="none" stroke="#85e9ff" stroke-width="3"/><text x="30" y="139" font-size="20">KMTA</text><path d="M166.28 133H816.01" stroke="#b99aff" stroke-width="9" stroke-linecap="round"/><text x="30" y="182" font-size="20">KMTC</text><path d="M162.34 176H814.83" stroke="#ffa66c" stroke-width="9" stroke-linecap="round"/><text x="30" y="225" font-size="20">KMTS</text><path d="M167.25 219H828.03" stroke="#8ee0bd" stroke-width="9" stroke-linecap="round"/><text x="30" y="268" font-size="20">Spitzer</text><path d="M486.58 262H588.42" stroke="#ffd37c" stroke-width="9" stroke-linecap="round"/><text x="30" y="311" font-size="20">MOA</text><path d="M160.00 305H732.67" stroke="#ffa1cd" stroke-width="9" stroke-linecap="round"/><path d="M171 297l-12 8 12 8" fill="none" stroke="#ffa1cd" stroke-width="3"/><text x="160.00" y="355" text-anchor="middle" font-size="17" fill="#bdcbe3">7440</text><text x="326.12" y="355" text-anchor="middle" font-size="17" fill="#bdcbe3">7500</text><text x="492.23" y="355" text-anchor="middle" font-size="17" fill="#bdcbe3">7560</text><text x="658.35" y="355" text-anchor="middle" font-size="17" fill="#bdcbe3">7620</text><text x="830.00" y="355" text-anchor="middle" font-size="17" fill="#bdcbe3">7682</text><text x="495" y="383" text-anchor="middle" font-size="17" fill="#bdcbe3">HJD − 2450000 · days</text><text x="30" y="417" font-size="16" fill="#bdcbe3">Date ranges only; gaps remain. Left arrows: earlier baseline. Source: Shin et al. 2022 / CDS-VizieR.</text></g></svg>
